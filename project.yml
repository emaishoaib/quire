name: Quire

options:
  bundleIdPrefix: com.mashoaib
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.7"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

targets:
  Quire-macOS:
    type: application
    platform: macOS
    sources:
      - macOS
    dependencies:
      - package: Sparkle
    info:
      path: macOS/Info.plist
      properties:
        SUFeedURL: https://$(QUIRE_UPDATES_HOST)/quire/appcast.xml
        SUPublicEDKey: $(QUIRE_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeIconFile: DocumentIcon
            CFBundleTypeName: PDF Document
            NSDocumentClass: Quire.QuireDocument
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    settings:
      base:
        PRODUCT_NAME: Quire
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.quire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
